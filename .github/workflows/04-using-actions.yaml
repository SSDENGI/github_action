name: 04 - Using Actions
on: 
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
      - name: Checkout Code
        uses: actions/checkout@v3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Install Dependencies
        working-directory: 04-using-actions/react-app
        run: |
          npm install
          npm ci    
      - name: Run Unit Tests
        working-directory: 04-using-actions/react-app
        run: |
          npm run test
        
        
      