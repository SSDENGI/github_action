name: 17 - 3 - Custom Actions - Docker
on:
  workflow_dispatch:
    inputs:
      url:
        default: https://www.google.com

jobs:
  ping-url:
    runs-on: ubuntu-latest
    steps:
      - name: Cehckout code
        uses: actions/checkout@v4

      - name: Ping url
        uses: ./.github/actions/docker-ping-url
        with:
          url: ${{ inputs.url}}