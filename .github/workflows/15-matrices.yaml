name: 15 - Working with Matrices
on:
  workflow_dispatch:
jobs:
  backwards-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node_version:
          - 18.x
          - 19.x
          - 20.x
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            node_version: 20.x
            tag: experimental
          - node_version: 17.x
            os: ubuntu-latest
      fail-fast: true
    name: Node ${{ matrix.os}} - ${{ matrix.node_version }}
    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node_version }}
      - name: Fail if experimental
        if: ${{ matrix.tag == 'experimental' }}
        run: exit 0
      - name: Perform some tests
        run: |
          sleep 5
      - name: Upload test results
        run: echo "Uploading test results"

  include-example:
    runs-on: ubuntu-latest
    name: ${{ matrix.color }} - ${{ matrix.shape }} - ${{ matrix.size }}- ${{ matrix.opacity }}
    strategy:
      matrix:
        color:
          - red
          - green
        shape:
          - circle
          - square
        size:
          - small
          - large
        include:
          - opacity: 50
          - color: red
            shape: triangle
    steps:
      - name: dummy steps
        run: echo "${{matrix.color}} - ${{matrix.shape}} - ${{matrix.size}} - ${{matrix.opacity}}"

      