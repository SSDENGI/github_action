name : 06-contexts
run-name:  06 - Contexts | DEBUG - ${{ inputs.debug }}

on:
  push:
  
  workflow_dispatch:
  inputs:
    debug:
      descrtiption: 'Enable debug mode
      type: boolean
      default: false
    

jobs:
  echo-data:
    runs-on: ubuntu-latest
    steps:
      - name: Display information about the workflow run
        run: |
          echo "Event Name : ${{ github.event_name }}"
          echo " Ref : ${{ github.ref }}"
          echo "SHA : ${{github.sha}}"
          echo "Actor : ${{ github.actor}}"
          echo "Workflow : ${{github.workflow}}"
          echo "Run Id : ${{github.run_id}}"
          echo "Run Numbrer: ${{github.run_number}}"
      - name: Retrieve Variable
        run: |
          echo "using Vars Context :${{ vars.MY_VAR }}"
         