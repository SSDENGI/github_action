name : 06-contexts
on:
  push:
  
  workflow_dispatch:

jobs:
  echo-data:
    runs-on: ubuntu-latest
    steps:
      - name: Display information about the workflow run
        run: |
          echo "Event Name : ${{ github.event_name }}"
          echo " Ref : ${{ github.ref }}"
          echo "SHA : ${{github.sha}}"
          echo "Actor : ${{ github.actor}}"
          echo "Workflow : ${{github.workflow}}"
          echo "Run Id : ${{github.run_id}}"
          echo "Run Numbrer: ${{github.run_number}}"
      - name: Retrieve Variable
        run: |
          echo "Env Context :${{ env.MY_VAR }}"
          echo "env_MY_VAR :  $env_MY_VAR"
          echo " ${{toJson(env)}}"