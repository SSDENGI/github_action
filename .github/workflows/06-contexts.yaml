name : 06-contexts
run-name:  06 - Contexts | DEBUG - ${{ inputs.debug }}
env:
  MY_WORKFLOW_VAR: workflow
  MY_OVERWRITTEN_VAR: workflow
on:
  push:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        type: boolean
        default: false

jobs:
  echo-data:
    env:
      MY_JOB_VAR: job
      MY_OVERWRITTEN_VAR: job
    runs-on: ubuntu-latest
    steps:
      - name: Display information about the workflow run
        run: |
          echo "Event Name : ${{ github.event_name }}"
          echo " Ref : ${{ github.ref }}"
          echo "SHA : ${{github.sha}}"
          echo "Actor : ${{ github.actor}}"
          echo "Workflow : ${{github.workflow}}"
          echo "Run Id : ${{github.run_id}}"
          echo "Run Numbrer: ${{github.run_number}}"
      - name: Retrieve Variable
        run: |
          echo "using Vars Context :${{ vars.MY_VAR }}"

      - name: Retrive Environment Variables
        env:
          MY_OVERWRITTEN_VAR: step
        run: |
          echo "Using Env Context : $MY_WORKFLOW_VAR"
          echo "Using Env Context : $MY_JOB_VAR"
          echo "Using Env Context : $MY_OVERWRITTEN_VAR"
      - name: Retrive Environment Varibales without step env
        run: |
          echo "Using Env Context : $MY_WORKFLOW_VAR"
          echo "Using Env Context : $MY_JOB_VAR"
          echo "Using Env Context : $MY_OVERWRITTEN_VAR"
         