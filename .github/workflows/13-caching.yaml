name: 13 - Using Caching
on: 
  workflow_dispatch:
    inputs:
      use-cache:
        type: boolean
        description: Whether to execute cache step
        default: true
      node-version:
        type: choice
        description: Node version
        options:
          - '16.x'
          - '18.x'
          - '20.x'
        default: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    needs: install-deps
    defaults:
      run:
        working-directory: 13-caching/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}
      - name: Download cached dependencies
        id: cache
        uses: actions/cache@v3
        with:
          key: ${{ needs.install-deps.outputs.CACHE_KEY}}
          path: 13-caching/react-app/node_modules
      - name: list files
        run: echo "${{toJson(steps)}}"
      - name: Testing
        run: npm run test
      - name: Building
        run: npm run build
      - name: Deploying to nonprod
        run: echo "Deploying to nonprod, ${GITHUB_SHA}"
  install-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-caching/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version}}
      - name: Calculate cache key
        id: cache-key
        if: ${{ inputs.use-cache == true }}
        outputs:
          CACHE_KEY: ${{ steps.cache-key.outputs.CACHE_KEY }}
        run: echo "CACHE_KEY=deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json') }}" >> $GITHUB_OUTPUT
      - name: Download cached dependencies
        id: cache
        if: ${{ inputs.use-cache == true }}
        uses: actions/cache@v3
        with:
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}
          path: 13-caching/react-app/node_modules
      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'ture' }}
        run: npm install
  linting:
    needs: install-deps
    runs-on: ubuntu-latest
    if: ${{ success()}}
    defaults:
      run:
        working-directory: 13-caching/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{inputs.node-version }}
      - name: Download cached dependencies
        uses: actions/cache@v3
        with:
          key: ${{ needs.install-deps.outputs.CACHE_KEY }}
          path: 13-caching/react-app/node_modules
      - name: Testing
        run: npm run test
      - name: Linting
        run: echo "Linting the code"
      
        
        