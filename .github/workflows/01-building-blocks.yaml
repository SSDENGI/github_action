name: 01 - Building Blocks
on: [push, workflow_dispatch]
jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Failed step
        run: |
          echo " This step will fail"
      - name: Say Goodbye
        run: "Goodbye, World!"
        
