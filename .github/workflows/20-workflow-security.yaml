name: 20 - Workflow Security
on:
  pull_request:

jobs:
  unsafe-pr:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Check PR title
        run: |
          title=${{github.event.pull_request.title}}
          if [[ $title =~ ^feat ]];then
            echo "this is feature"
            exit 0
          else
            echo "this is not feature"
            exit 1
          fi
  safe-pr:
    runs-on: ubuntu-latest
    env:
      title: ${{github.event.pull_request.title}}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Check PR title
        run: |
          if [[ $title =~ ^feat ]];then
            echo "this is feature"
            exit 0
          else
            echo "this is not feature"
                exit 1
              fi
  js-safer-pr:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Check PR title
        uses: ./.github/actions/safe-title-check
        with:
          pr-title: ${{github.event.pull_request.title}}
