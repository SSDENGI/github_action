name: 09 - Using Functions
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  echo1:
    runs-on: ubuntu-latest
    steps:
      - name: Print PR titles
        run: |
          echo "PR Title: ${{github.event.pull_request.title}}"
      - name: Print PR labels
        run: |
          echo ' PR Labels:  ${{toJSON(github.event.pull_request.labels)}}'
      - name: Failing step
        run: |
          exit 1
      - name: Bug step
        if: ${{ failure() && contains(github.event.pull_request.title, 'fix') }}
        run: |
          echo " I am a bug fix"
      - name: Sleep for 20 seconds
        run: |
          sleep 20
      - name: I will be skipped
        if: ${{ success()}}
        run: |
          echo " I will print if previous step is successful "
      - name: I will execute
        if: ${{ failure()}}
        run: |
          echo " I will print if previous step failed "

      - name: i Will Definately executes
        if: ${{ always()}}
        run: |
          echo "I will always print, except when the workflow is cancelled"

      - name: I will execute when cancelled
        if: ${{ cancelled()}}
        run: |
          echo "I will print if the workflow is cancelled"


      
